<!DOCTYPE html>
<html>
<head>
    <title>Taiwan Housing PIR Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
        .info { padding: 6px 8px; background: white; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // 1. 初始化地圖，中心點設在台灣
        var map = L.map('map').setView([23.6, 121.0], 7);

        // 2. 加入 OpenStreetMap 底圖
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. 載入行政區 GeoJSON，並顯示房價中位數、薪資中位數和負擔能力
        function getColor(affordability) {
            return affordability > 40 ? '#800026'
                 : affordability > 30 ? '#BD0026'
                 : affordability > 20 ? '#E31A1C'
                 : affordability > 10 ? '#FC4E2A'
                 : affordability > 0   ? '#FD8D3C'
                                       : '#CCCCCC';
        }

        function style(feature) {
            var a = feature.properties.affordability;
            return {
                fillColor: getColor(a),
                weight: 1,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }

        function onEachFeature(feature, layer) {
            var props = feature.properties || {};
            var name = (props.COUNTYNAME || '') + (props.TOWNNAME || '') + (props.VILLNAME || '');
            var housingMedian = props.housing_median !== undefined ? props.housing_median : '無資料';
            var salaryMedian = props.MEDIAN !== undefined ? props.MEDIAN : '無資料';
            var affordability = props.affordability !== undefined ? props.affordability.toFixed(2) : '無資料';
            layer.bindPopup('<strong>' + name + '</strong><br>房價中位數: ' + housingMedian + '<br>薪資中位數: ' + salaryMedian + '<br>房價負擔能力: ' + affordability);
        }

        fetch('taiwan_districts_simple_extended.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: style,
                    onEachFeature: onEachFeature
                }).addTo(map);

                var legend = L.control({position: 'bottomright'});
                legend.onAdd = function (map) {
                    var div = L.DomUtil.create('div', 'info legend');
                    var grades = [0, 10, 20, 30, 40];
                    var labels = [];
                    div.innerHTML += '<strong>房價負擔能力</strong><br>';
                    for (var i = 0; i < grades.length; i++) {
                        div.innerHTML +=
                            '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                            grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
                    }
                    return div;
                };
                legend.addTo(map);
            });
    </script>
</body>
</html>
